{% load static %}

<div class="svc-card">
    <div class="svc-img">
        {% if service.image %}
        <img src="{{ service.image.url }}" alt="{{ service.title }}" loading="lazy" decoding="async">
        {% else %}
        <img src="{% static 'images/default-service.jpg' %}" alt="Service" loading="lazy" decoding="async">
        {% endif %}
    </div>

    <div class="svc-content">
        <h4>
            {{ service.title }}
        </h4>

        <p>
            {{ service.description|truncatewords:20 }}
        </p>

        {% if service.tech_list %}
        <div class="svc-tech-preview">
            {% for tech in service.tech_list|slice:":4" %}
            <span class="svc-tech-chip">
                {{ tech }}
            </span>
            {% endfor %}
        </div>
        {% endif %}

        <div class="svc-btn-row align-items-center">
            <a href="{% url 'service_detail' service.id %}" class="btn btn-primary px-4 py-2">
                View Details <span>→</span>
            </a>
        </div>
    </div>
</div>
